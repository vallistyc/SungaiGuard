<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360" role="img" aria-labelledby="title description">
  <title id="title">Arsitektur River Guard</title>
  <desc id="description">Sensor sungai mengirim pembacaan NTU ke Supabase dan dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#53716b"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { fill: #173b38; font-size: 23px; font-weight: 700; }
      .heading { fill: #234743; font-size: 16px; font-weight: 700; }
      .body { fill: #607a74; font-size: 12px; }
      .card { fill: #fff; stroke: #dce9e5; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1080" height="360" rx="20" fill="#f3f8f6"/>
  <text x="48" y="48" class="title">Arsitektur River Guard · Pemantauan NTU</text>
  <rect x="48" y="92" width="260" height="160" rx="14" class="card"/>
  <text x="76" y="128" class="heading">Stasiun sungai</text>
  <text x="76" y="158" class="body">DFRobot SEN0189</text>
  <text x="76" y="180" class="body">ESP32-S3 · ADC 12-bit</text>
  <text x="76" y="202" class="body">NTU · tegangan · ADC</text>
  <path d="M308 172h74" stroke="#53716b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="154" class="body">HTTPS</text>
  <rect x="390" y="92" width="292" height="160" rx="14" class="card"/>
  <text x="418" y="128" class="heading">Supabase</text>
  <text x="418" y="158" class="body">public.readings</text>
  <text x="418" y="180" class="body">id · created_at · device_id</text>
  <text x="418" y="202" class="body">adc_raw · voltage · ntu · status</text>
  <path d="M682 172h74" stroke="#53716b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="696" y="154" class="body">REST · polling</text>
  <rect x="764" y="92" width="268" height="160" rx="14" class="card"/>
  <text x="792" y="128" class="heading">Dashboard web</text>
  <text x="792" y="158" class="body">Grafik · kartu · riwayat</text>
  <text x="792" y="180" class="body">Status dihitung dari NTU</text>
  <text x="792" y="202" class="body">Jernih · Agak Keruh</text>
  <text x="792" y="224" class="body">Keruh · Sangat Keruh</text>
  <rect x="48" y="278" width="984" height="44" rx="10" fill="#e7f2ee"/>
  <text x="72" y="305" class="body">Ambang klasifikasi tunggal: 10 · 40 · 100 NTU  |  Pembaruan dashboard berkala tanpa koneksi realtime</text>
</svg>
