<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 400" width="1110" height="400" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1110" height="400" fill="#ffffff"/>
  <text x="555" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Arsitektur River Guard: Pemantauan Kekeruhan Sungai</text>

  <!-- Node 1: Sungai + sensor -->
  <rect x="20" y="70" width="200" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <path d="M40 98 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="120" y="126" text-anchor="middle" font-size="16" font-weight="700" fill="#0c4a6e">Sungai + Sensor</text>
  <text x="120" y="148" text-anchor="middle" font-size="13" fill="#0c4a6e">SEN0189 (probe terendam)</text>
  <text x="120" y="167" text-anchor="middle" font-size="13" fill="#0c4a6e">+ pembagi tegangan</text>

  <!-- Node 2: ESP32 -->
  <rect x="320" y="70" width="190" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="415" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">ESP32</text>
  <text x="415" y="124" text-anchor="middle" font-size="13" fill="#14532d">Median sampel ADC</text>
  <text x="415" y="143" text-anchor="middle" font-size="13" fill="#14532d">Validasi rentang</text>
  <text x="415" y="162" text-anchor="middle" font-size="13" fill="#14532d">Konversi tegangan → NTU</text>

  <!-- Node 3: Supabase -->
  <rect x="610" y="70" width="200" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#3b0764">Supabase</text>
  <text x="710" y="124" text-anchor="middle" font-size="13" fill="#3b0764">Postgres, tabel readings</text>
  <text x="710" y="143" text-anchor="middle" font-size="13" fill="#3b0764">REST API + RLS</text>
  <text x="710" y="162" text-anchor="middle" font-size="13" fill="#3b0764">(ntu, tegangan, tss_est)</text>

  <!-- Node 4: Dashboard -->
  <rect x="910" y="70" width="180" height="120" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1000" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#7c2d12">Dashboard Web</text>
  <text x="1000" y="124" text-anchor="middle" font-size="13" fill="#7c2d12">Estimasi TSS (a·NTU + b)</text>
  <text x="1000" y="143" text-anchor="middle" font-size="13" fill="#7c2d12">Indikator PP 22/2021</text>
  <text x="1000" y="162" text-anchor="middle" font-size="13" fill="#7c2d12">Deteksi kenaikan mendadak</text>

  <!-- Arrows + labels -->
  <line x1="226" y1="130" x2="314" y2="130" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="270" y="112" text-anchor="middle" font-size="12" fill="#334155">sinyal</text>
  <text x="270" y="154" text-anchor="middle" font-size="12" fill="#334155">analog</text>

  <line x1="516" y1="130" x2="604" y2="130" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="560" y="112" text-anchor="middle" font-size="12" fill="#334155">HTTPS POST</text>
  <text x="560" y="154" text-anchor="middle" font-size="12" fill="#334155">tiap 3-60 dtk</text>

  <line x1="904" y1="130" x2="816" y2="130" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="860" y="112" text-anchor="middle" font-size="12" fill="#334155">REST GET</text>
  <text x="860" y="154" text-anchor="middle" font-size="12" fill="#334155">polling</text>

  <!-- Optional modules (dashed) -->
  <rect x="300" y="222" width="230" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="415" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Opsional di lapangan</text>
  <text x="415" y="259" text-anchor="middle" font-size="12" fill="#475569">suhu · level air · panel surya · GSM</text>
  <line x1="415" y1="220" x2="415" y2="194" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrd)"/>

  <rect x="860" y="222" width="230" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="975" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Kalibrasi lokasi</text>
  <text x="975" y="259" text-anchor="middle" font-size="12" fill="#475569">sampel + uji TSS lab → a, b</text>
  <line x1="1000" y1="220" x2="1000" y2="194" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrd)"/>

  <!-- Legend -->
  <text x="20" y="300" font-size="13" font-weight="700" fill="#0f172a">Indikator TSS estimasi (baku mutu air sungai, PP 22/2021 Lampiran VI)</text>
  <rect x="20"  y="312" width="200" height="32" rx="16" fill="#d1fae5" stroke="#10b981"/>
  <text x="120" y="333" text-anchor="middle" font-size="13" fill="#065f46">Kelas I: ≤ 40 mg/L</text>
  <rect x="232" y="312" width="200" height="32" rx="16" fill="#ecfccb" stroke="#84cc16"/>
  <text x="332" y="333" text-anchor="middle" font-size="13" fill="#365314">Kelas II: ≤ 50 mg/L</text>
  <rect x="444" y="312" width="200" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="544" y="333" text-anchor="middle" font-size="13" fill="#78350f">Kelas III: ≤ 100 mg/L</text>
  <rect x="656" y="312" width="200" height="32" rx="16" fill="#ffedd5" stroke="#f97316"/>
  <text x="756" y="333" text-anchor="middle" font-size="13" fill="#7c2d12">Kelas IV: ≤ 400 mg/L</text>
  <rect x="868" y="312" width="222" height="32" rx="16" fill="#fee2e2" stroke="#ef4444"/>
  <text x="979" y="333" text-anchor="middle" font-size="13" fill="#7f1d1d">Melampaui: &gt; 400 mg/L</text>

  <text x="20" y="378" font-size="12" fill="#475569">Estimasi indikatif dari sensor kekeruhan. Bukan penetapan status mutu air resmi (perlu uji laboratorium dan parameter lengkap).</text>
</svg>
